{% extends 'base.html' %}
{% load static %}

{% block title %}Error 404 - Página no encontrada | Colegio de Geólogos de Catamarca{% endblock %}

{% block content %}
<main class="flex min-h-[calc(100vh-4rem)] items-center justify-center p-2 sm:p-4">
    <h1 class="sr-only">Error 404: Página no encontrada - Colegio de Geólogos de Catamarca</h1>
    <figure class="w-full max-w-7xl">
        <img
            src="{% static 'img/error404.jpg' %}"
            alt="Ilustración informativa: Error 404, la página solicitada no fue encontrada o no existe"
            class="mx-auto max-h-[calc(100vh-6rem)] w-full object-contain rounded-lg"
            loading="eager"
        >
        <figcaption class="sr-only">La página solicitada no está disponible. Podés usar la barra de navegación superior para continuar navegando por el sitio.</figcaption>
    </figure>
</main>
{% endblock %}
